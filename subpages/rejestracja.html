<!DOCTYPE HTML>
<html lang="pl">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fanklub Jury Krakowsko-Częstochowkiej - Rejestracja</title>
        <link rel="stylesheet" href="../styles/shared.css">
        <link rel="stylesheet" href="../styles/form.css">
        <link rel="icon" type="image/x-icon" href="../media/mountain.ico">
        <script type="text/Javascript" src="../scripts/shared.js"></script>
        <script type="text/Javascript" src="../scripts/register.js"></script>
    </head>
    <body>
        <header>
            <nav>
                <a href="../index.html">Strona główna</a>
                <a href="galeria.html">Galeria</a>
                <a href="kontakt.html">Kontakt</a>
            </nav>
            <nav id="login-container">
                <img src="../media/svg/user.svg" alt="Ikona użytkownika">
            </nav> <!--Handled by shared.js-->
        </header>
        <main>
            <h1>Dołącz do nas</h1>
            <form>
                <fieldset>
                    <legend>Rejestracja</legend>
                    <section>
                        <label for="email">Email:*</label>
                        <input type="email" id="email" required maxlength="254" placeholder="example@example.com">
                    </section>
                    <section>
                        <label for="password">Hasło:*</label>
                        <input type="password" id="password" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[#?!@$%^&*\-]).*" required>
                    </section>
                    <section>
                        <label for="password2">Powtórz hasło:*</label>
                        <input type="password" id="password2" minlength="8" required>
                    </section>
                    <h4>Dane osobowe:</h4>
                    <section>
                        <label for="name">Imię:*</label>
                        <input type="text" id="name" required minlength="2" maxlength="100">
                    </section>
                    <section>
                        <label for="surname">Nazwisko:*</label>
                        <input type="text" id="surname" required minlength="3" maxlength="100">
                    </section>
                    <section>
                        <label for="phone">Nr telefonu:*</label>
                        <input type="tel" id="phone" pattern="^[+]?[0-9\s\-]{7,15}$">
                    </section>
                    <section>
                        <label for="street">Ulica:*</label>
                        <input type="text" id="street" required minlength="2" maxlength="150">
                    </section>
                    <section>
                        <label for="house-number">Numer domu/lokalu:*</label>
                        <input type="text" id="house-number" required minlength="1" maxlength="10">
                    </section>
                    <section>
                        <label for="city">Miasto:*</label>
                        <input type="text" id="city" required minlength="2" maxlength="150">
                    </section>
                    <section>
                        <label for="postal">Kod pocztowy:*</label>
                        <input type="text" id="postal" required pattern="[0-9]{2}-[0-9]{3}" placeholder="00-000">
                    </section>
                    <section>
                        <label for="voivodeship">Województwo:*</label>
                        <select id="voivodeship" required>
                            <option value="" disabled selected hidden>Wybierz...</option>
                            <option value='dolnośląskie'>Dolnośląskie</option>
                            <option value='kujawsko-pomorskie'>Kujawsko-pomorskie</option>
                            <option value='lubelskie'>Lubelskie</option>
                            <option value='lubuskie'>Lubuskie</option>
                            <option value='łódzkie'>Łódzkie</option>
                            <option value='małopolskie'>Małopolskie</option>
                            <option value='mazowieckie'>Mazowieckie</option>
                            <option value='opolskie'>Opolskie</option>
                            <option value='podkarpackie'>Podkarpackie</option>
                            <option value='podlaskie'>Podlaskie</option>
                            <option value='pomorskie'>Pomorskie</option>
                            <option value='śląskie'>Śląskie</option>
                            <option value='świętokrzyskie'>Świętokrzyskie</option>
                            <option value='warmińsko-mazurskie'>Warmińsko-mazurskie</option>
                            <option value='wielkopolskie'>Wielkopolskie</option>
                            <option value='zachodniopomorskie'>Zachodniopomorskie</option>
                        </select>
                    </section>
                    <section>
                        <label for="newsletter">Newsletter:</label>
                        <section id="newsletter">
                            <section>
                                <label for="newletter1">Chcę otrzymywać Newsletter</label>
                                <input type="radio" name="newsletter" id="newsletter1" checked>
                            </section>
                            <section>
                                <label for="newletter2">Nie chcę otrzymywać Newslettera</label>
                                <input type="radio" name="newsletter" id="newsletter2">
                            </section>
                        </section>
                        <a href="logowanie.html">Masz już konto? Zaloguj się</a>
                    </section>
                    <section>
                        <span class="submit-message"></span>
                        <input type="submit" id="submit" value="Zarejestruj">
                    </section>
                </fieldset>
            </form>
        </main>
        <footer>
            <blockquote>„Jednym słowem przedziwny zakątek polskiej ziemi, który poznany i spenetrowany – zostanie na zawsze w sercu wędrowca!"</blockquote>
            <cite>~S. Pagaczewski</cite>
            <h4>Autor: Marcin Szlęk</h4>
        </footer>
    </body>
</html>
